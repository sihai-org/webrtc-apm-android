name: Build and verify AAR
on:
  workflow_dispatch:
    inputs:
      abis:
        description: 'JSON ABI array'
        default: '["armeabi-v7a","arm64-v8a","x86_64"]'
        required: true
  push:
    tags: ['v*']
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        abi: ${{ fromJSON(inputs.abis || '["armeabi-v7a","arm64-v8a","x86_64"]') }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Prepare runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libglib2.0-dev libnss3-dev libnspr4-dev
          df -h
      - name: Build official APM and JNI
        run: python3 scripts/build_native.py --work "$RUNNER_TEMP/apm-build" --abi '${{ matrix.abi }}'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-${{ matrix.abi }}
          path: dist/
          if-no-files-found: error
          retention-days: 7
  package:
    if: inputs.abis == '["armeabi-v7a","arm64-v8a","x86_64"]' || startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: native-*
          path: incoming
      - name: Check generated coverage and native artifacts
        run: |
          python3 scripts/generate_config.py --check
          python3 -m unittest discover -s scripts -p 'test_*.py'
          python3 scripts/package_native.py incoming
      - name: Build release AAR and independent consumer
        run: |
          ./gradlew :apm:assembleRelease :apm:lintRelease
          mkdir -p dist
          version=$(sed -n 's/^version=//p' gradle.properties)
          cp apm/build/outputs/aar/apm-release.aar "dist/webrtc-apm-android-$version.aar"
          ./gradlew :consumer:assembleRelease :consumer:assembleReleaseAndroidTest :consumer:lintRelease
      - name: Verify on Android 10 emulator
        run: bash scripts/emulator_test.sh
      - name: Collect distribution
        run: |
          cp apm/build/native/resources/META-INF/webrtc-apm/build-info.json dist/
          cp upstream.lock.json dist/
          cp LICENSE dist/
          cp incoming/native-arm64-v8a/arm64-v8a/LICENSE.md dist/THIRD_PARTY_LICENSES.md
          tar -czf dist/native-debug-symbols.tar.gz -C incoming .
          cd dist
          sha256sum *.aar native-debug-symbols.tar.gz build-info.json upstream.lock.json THIRD_PARTY_LICENSES.md LICENSE > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: distribution
          path: dist/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: verification-reports
          path: |
            apm/build/reports/
            consumer/build/reports/
            consumer/build/outputs/androidTest-results/
          retention-days: 14
      - name: Publish versioned release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^version=//p' gradle.properties)
          test "$GITHUB_REF_NAME" = "v$version"
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --title "$GITHUB_REF_NAME" --notes-file "docs/releases/$version.md"
